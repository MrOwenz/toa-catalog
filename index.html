<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แคตตาล็อกผลิตภัณฑ์</title>
<meta name="theme-color" content="#0a3fa8">
<script>
(function(){try{var t=localStorage.getItem('catalog-theme');if(!t){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<style>
  :root{
    --bg:#f4f7fc; --surface:#ffffff; --card:#ffffff; --text:#14213d; --muted:#6b7a90;
    --primary:#0a3fa8; --primary-dark:#072c78; --primary-soft:#e8f0ff; --primary-text:#0a3fa8;
    --accent:#e11d2e; --accent-dark:#b3121f; --accent-text:#e11d2e;
    --border:#dfe6f2; --chip:#eef2fa; --badge-text:#4b5563; --input-bg:#ffffff;
    --ph-a:#eef3ff; --ph-b:#dbe6fb; --topbar-a:#0a3fa8; --topbar-b:#072c78;
    --err-bg:#fff4f4; --err-border:#ffd0d0; --err-text:#a30000; --overlay:rgba(15,20,30,.55);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0b1220; --surface:#121b2d; --card:#121b2d; --text:#e6ecf7; --muted:#8fa0b8;
    --primary:#2f6feb; --primary-dark:#1d4fb8; --primary-soft:#1a2b52; --primary-text:#8db4ff;
    --accent:#ff4d5e; --accent-dark:#d63a49; --accent-text:#ff6b79;
    --border:#25324d; --chip:#1b2740; --badge-text:#b5c2d8; --input-bg:#0e1626;
    --ph-a:#182640; --ph-b:#101a2e; --topbar-a:#0c2a6b; --topbar-b:#061a45;
    --err-bg:#3a1418; --err-border:#6b2129; --err-text:#ffb3ba; --overlay:rgba(0,0,0,.68);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Tahoma,'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s}

  /* ---- top brand bar ---- */
  .topbar{background:linear-gradient(135deg,var(--topbar-a),var(--topbar-b));color:#fff;border-bottom:4px solid var(--accent);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;cursor:pointer}
  .brand .logo{height:46px;width:46px;border-radius:9px;background:#f0f3fa;box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.25);display:block}
  .topbar .sync{font-size:.75rem;color:rgba(255,255,255,.85)}
  .topright{display:flex;align-items:center;gap:14px}
  .theme-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px;font-size:.8rem;font-weight:600;cursor:pointer;transition:background .15s;font-family:inherit}
  .theme-btn:hover{background:rgba(255,255,255,.26)}
  .theme-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .theme-btn .ti{font-size:1rem;line-height:1}
  @media (max-width:520px){.theme-btn .tl{display:none}.theme-btn{padding:7px 10px}.topbar{padding:12px 16px}}

  /* ---- HOME VIEW ---- */
  .hero{text-align:center;padding:48px 20px 20px}
  .hero h1{margin:0 0 8px;font-size:1.7rem;color:var(--primary-text)}
  .hero h1::after{content:'';display:block;width:54px;height:4px;border-radius:2px;background:var(--accent);margin:10px auto 0}
  .hero p{margin:0;color:var(--muted);font-size:.92rem}
  .group-grid{max-width:1040px;margin:0 auto;padding:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
  .group-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0 0 20px;text-align:center;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:8px;border-top:4px solid var(--primary);overflow:hidden}
  .group-card:hover{box-shadow:0 8px 22px rgba(0,0,0,.09);transform:translateY(-2px);border-color:var(--primary);border-top-color:var(--accent)}
  .group-card .gimg{width:100%;aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center}
  .group-card .gimg img{width:100%;height:100%;object-fit:contain;padding:10px;transition:transform .2s}
  .group-card:hover .gimg img{transform:scale(1.05)}
  .group-card .gimg.ph{background:linear-gradient(135deg,var(--ph-a),var(--ph-b));font-size:4rem}
  .group-card .name{font-weight:700;font-size:1rem;padding:0 12px;margin-top:4px}
  .group-card .hint{font-size:.72rem;color:var(--muted)}

  /* ---- controls row (catalog view) ---- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--border)}
  .backBtn{color:var(--text);background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:9px 14px;cursor:pointer;font-size:.85rem;font-weight:600}
  .toolbar input[type=text]{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;background:var(--input-bg);color:var(--text)}
  .toolbar select,.toolbar button{padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:.85rem;cursor:pointer}
  .toolbar button.primary{background:var(--primary);color:#fff;border:none}
  #status{font-size:.78rem;color:var(--muted);padding:8px 28px 0}
  .legend{padding:2px 28px 10px;font-size:.72rem;color:var(--muted)}

  /* ---- category icon strip (within a group) ---- */
  .cats-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;position:sticky;top:0;z-index:5}
  .cats{display:flex;gap:22px;overflow-x:auto;padding-bottom:2px}
  .cat-btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px 10px;border-radius:10px;border:none;background:transparent}
  .cat-btn .ic{width:52px;height:52px;border-radius:10px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:1px solid var(--border)}
  .cat-btn.active .ic{background:var(--primary);color:#fff;border-color:var(--primary)}
  .cat-btn span.lbl{font-size:.72rem;color:var(--text);white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
  .cat-btn.active span.lbl{color:var(--primary-text);font-weight:700}
  .cat-btn.active{box-shadow:inset 0 -3px 0 var(--accent)}

  #err{display:none;margin:16px 28px;padding:14px 16px;background:var(--err-bg);border:1px solid var(--err-border);border-radius:10px;color:var(--err-text);font-size:.85rem;line-height:1.5}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  main{padding:20px 28px 48px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s}
  .card:hover{box-shadow:0 6px 18px rgba(10,63,168,.14);border-color:var(--primary)}
  .thumb{aspect-ratio:4/3;background:linear-gradient(135deg,var(--ph-a),var(--ph-b));display:flex;align-items:center;justify-content:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .ph{font-size:2.4rem;opacity:.4}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .cat-tag{font-size:.68rem;color:var(--accent-text);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .card h3{margin:0;font-size:1rem;line-height:1.35}
  .card .size{font-size:.8rem;color:var(--muted)}
  .edge-row{font-size:.72rem;color:var(--muted)}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--border)}
  .badge{background:var(--chip);color:var(--badge-text);font-size:.66rem;padding:3px 8px;border-radius:6px;white-space:nowrap}
  a.badge.link{background:var(--primary-soft);color:var(--primary-text);text-decoration:none;font-weight:700;cursor:pointer}
  a.badge.link:hover{background:var(--primary);color:#fff}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}

  /* ---- product detail modal ---- */
  .card{cursor:pointer}
  .overlay{display:none;position:fixed;inset:0;background:var(--overlay);z-index:50;align-items:center;justify-content:center;padding:20px}
  .overlay.open{display:flex}
  .modal{background:var(--surface);color:var(--text);border-radius:14px;max-width:720px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
  .modal-close{position:absolute;top:12px;right:12px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer;z-index:2}
  .modal-hero{aspect-ratio:16/9;background:linear-gradient(135deg,var(--ph-a),var(--ph-b));display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px 14px 0 0}
  .modal-hero img{width:100%;height:100%;object-fit:cover}
  .modal-hero .ph{font-size:3.5rem;opacity:.4}
  .modal-body{padding:22px 24px 28px}
  .modal-body .cat-tag{display:block;margin-bottom:4px}
  .modal-body h2{margin:0 0 6px;font-size:1.3rem;color:var(--primary-text)}
  .modal-body .size{font-size:.88rem;color:var(--muted);margin-bottom:4px}
  .modal-body .edge-row{margin-bottom:12px}
  .doc-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
  .doc-row{border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .doc-row .doc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .doc-row .doc-label{font-weight:600;font-size:.88rem;display:flex;align-items:center;gap:6px}
  .doc-actions{display:flex;gap:8px}
  .doc-actions button, .doc-actions a{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:.76rem;cursor:pointer;text-decoration:none;color:var(--text);font-weight:600}
  .doc-actions a.dl{background:var(--primary);color:#fff;border-color:var(--primary)}
  .doc-actions a.dl:hover{background:var(--accent);border-color:var(--accent)}
  .doc-actions button:hover{border-color:var(--primary);color:var(--primary-text)}
  .doc-row.none .doc-label{color:var(--muted);font-weight:500}
  .doc-preview{margin-top:10px;display:none}
  .doc-preview.open{display:block}
  .doc-preview img{max-width:100%;border-radius:8px}
  .doc-preview video, .doc-preview iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px}

  /* ---- System (ระบบ) view ---- */
  .sys-desc{font-size:.82rem;color:var(--muted);line-height:1.5;white-space:pre-line}
  .sys-meta{font-size:.78rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
  .sys-section-title{font-size:.95rem;font-weight:800;color:var(--primary-text);margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--border)}
  .sys-section-title:first-of-type{margin-top:6px}
  .stc-block{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .stc-block .stc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .stc-block .stc-label{font-weight:700;font-size:.85rem}
  .stc-block .stc-value{font-weight:800;font-size:1rem;color:var(--accent-text);white-space:nowrap}
  .fire-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:480px){.fire-grid{grid-template-columns:1fr}}
  .fire-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .fire-card .fl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .fire-card .fv{font-size:.92rem;font-weight:700;margin-top:3px;white-space:pre-line}
</style>
</head>

let allProducts = [];
let allSystemItems = [];
let dataMode = 'product'; // 'product' | 'system'
let activeCat = "ทั้งหมด";
let pollTimer = null;
let currentSheet = null;

function currentItems(){ return dataMode === 'system' ? allSystemItems : allProducts; }

const CAT_ICONS = ['📋','🧱','🛡️','🔥','💧','🏗️','🔧','📐','🪵','🎨','⚙️','🏠'];
function iconFor(name){
  let h = 0;
  for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return CAT_ICONS[h % CAT_ICONS.length];
}

/* ---------- VIEW SWITCHING ---------- */
function showHome(){
  currentSheet = null;
  clearInterval(pollTimer);
  location.hash = '';
  document.getElementById('homeView').style.display = 'block';
  document.getElementById('catalogView').style.display = 'none';
  document.getElementById('topSync').textContent = '';
}
function showCatalog(sheetName){
  currentSheet = sheetName;
  location.hash = encodeURIComponent(sheetName);
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('catalogView').style.display = 'block';
  document.getElementById('sheetTab').value = sheetName;
  activeCat = 'ทั้งหมด';
  loadData();
  startPolling();
}

function renderHome(){
  const box = document.getElementById('groupGrid');
  box.innerHTML = '';
  GROUPS.forEach(g=>{
    const c = document.createElement('div');
    c.className = 'group-card';
    const visual = GROUP_IMAGES[g.id]
      ? `<div class="gimg"><img src="${GROUP_IMAGES[g.id]}" alt="${g.label}"></div>`
      : `<div class="gimg ph">${g.icon}</div>`;
    c.innerHTML = `${visual}<div class="name">${g.label}</div><div class="hint">ดูรายการสินค้า →</div>`;
    c.onclick = ()=> showCatalog(g.id);
    box.appendChild(c);
  });
}

document.getElementById('brandHome').onclick = showHome;

/* ---------- DATA FETCH / PARSE ---------- */
// ใช้ gid (เลขประจำแท็บ) แทนชื่อแท็บ เพื่อความแม่นยำ 100% — ชื่อแท็บบางครั้งดึงผิดแท็บได้
const GID_MAP = {
  'GYPSUM BOARD': 495596067,
  'Service Panel': 1809853560,
  'LINE': 1800678691,
  'WALL STEEL': 777799160,
  'Jointing': 1251169376,
  'System': 1602355223
  // 'Factory': ยังไม่มี gid — จะ fallback ไปใช้ชื่อแท็บแทนด้านล่าง
};

// gviz เดาชนิดข้อมูลรายคอลัมน์ ถ้าคอลัมน์ส่วนใหญ่เป็น checkbox มันจะทิ้งเซลล์ที่เป็นลิงก์/ข้อความให้กลายเป็นค่าว่าง
// จึงใช้ export ตรงๆ ก่อน (ได้ค่าตามที่เห็นในเซลล์จริง) แล้วค่อย fallback ไป gviz ถ้า export ใช้ไม่ได้
function csvSources(sheetName){
  const base = `https://docs.google.com/spreadsheets/d/${SHEET_ID}`;
  if(Object.prototype.hasOwnProperty.call(GID_MAP, sheetName)){
    const gid = GID_MAP[sheetName];
    return [
      {name:'export', url:`${base}/export?format=csv&gid=${gid}`},
      {name:'gviz',   url:`${base}/gviz/tq?tqx=out:csv&gid=${gid}`}
    ];
  }
  return [{name:'gviz', url:`${base}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`}];
}

async function fetchCsvText(sheetName){
  let lastErr = new Error('ไม่มีแหล่งข้อมูล');
  for(const src of csvSources(sheetName)){
    try{
      const res = await fetch(src.url, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if(text.trim().startsWith('<')) throw new Error('ได้รับ HTML แทน CSV (แปลว่า Sheet ยังไม่เปิดสิทธิ์สาธารณะ)');
      return {text, source: src.name};
    }catch(e){ lastErr = e; }
  }
  throw lastErr;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function findCol(headers, patterns, fallback){
  for(let i=0;i<headers.length;i++){
    if(headers[i] && patterns.test(headers[i])) return i;
  }
  return fallback;
}

function isUrl(v){ return /^https?:\/\//i.test((v||'').trim()); }
function driveFileId(v){
  const s = (v||'').trim();
  let m;
  if((m = s.match(/drive\.google\.com\/file\/d\/([^/?&]+)/))) return m[1];
  if((m = s.match(/drive\.google\.com\/open\?[^#]*\bid=([^&]+)/))) return m[1];
  if((m = s.match(/[?&]id=([^&]+)/))) return m[1];
  return null;
}
function toDriveImageUrl(v){
  const id = driveFileId(v);
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : v;
}
function isImageUrl(v){
  const u = (v||'').trim();
  if(!isUrl(u)) return false;
  if(/\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i.test(u)) return true;
  if(/lh3\.googleusercontent\.com/i.test(u)) return true;
  if(/drive\.google\.com\/thumbnail/i.test(u)) return true; // ลิงก์รูปแบบ thumbnail จาก Drive
  return false;
}

function classifyDoc(val){
  const u = (val||'').trim();
  if(!isUrl(u)) return {type:'none', url:u};
  if(isImageUrl(u)) return {type:'image', url:u};
  if(/\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(u)) return {type:'video', url:u};
  if(/\.pdf(\?.*)?$/i.test(u)) return {type:'pdf', url:u, embed:u};
  let m;
  if((m = u.match(/[?&]v=([^&]+)/)) || (m = u.match(/youtu\.be\/([^?&]+)/))){
    return {type:'youtube', url:u, embed:`https://www.youtube.com/embed/${m[1]}`};
  }
  if((m = u.match(/vimeo\.com\/(\d+)/))){
    return {type:'vimeo', url:u, embed:`https://player.vimeo.com/video/${m[1]}`};
  }
  if((m = u.match(/drive\.google\.com\/file\/d\/([^/]+)/))){
    return {type:'drive', url:u, embed:`https://drive.google.com/file/d/${m[1]}/preview`};
  }
  return {type:'file', url:u};
}

function buildProducts(rows, sheetName){
  if(!rows.length) return [];
  const headers = rows[0].map(h => h.trim());

  const catIdx  = findCol(headers, /ชนิด|ประเภท|หมวด|category/i, 0);
  const nameIdx = findCol(headers, /รายการ|ชื่อสินค้า|ชื่อ|product|name/i, catIdx === 0 ? 1 : 0);
  const sizeIdx = findCol(headers, /size|ขนาด/i, nameIdx + 1);
  const imgHeaderIdx = findCol(headers, /รูปภาพ|photo|image|mockup/i, -1);

  const edgeCols = headers.map((h,i)=>({h,i}))
    .filter(o => /square edge|recessed edge/i.test(o.h));
  const usedIdx = new Set([catIdx, nameIdx, sizeIdx, ...edgeCols.map(o=>o.i)]);
  const docCols = headers.map((h,i)=>({h,i}))
    .filter(o => o.h && o.h.trim() && !usedIdx.has(o.i));

  let lastCat = '';
  let anyCatFound = false;
  const out = [];
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(!row || row.every(c=>!c || !c.trim())) continue;
    const name = (row[nameIdx]||'').trim();
    if(!name) continue;
    if((row[catIdx]||'').trim()){ lastCat = row[catIdx].trim(); anyCatFound = true; }

    let docs = docCols
      .map(o => ({label:o.h.trim(), val:(row[o.i]||'').trim()}))
      .filter(o => o.val && !/^(false|no|0|-)$/i.test(o.val));

    // รูปสินค้า: ใช้คอลัมน์ Mockup/รูปภาพ/photo/image ก่อน ถ้าเป็นลิงก์รูปจริง (ไม่ใช่แค่ชื่อไฟล์)
    // ถ้ายังไม่ใช่ลิงก์ ให้คงไว้เป็น badge เอกสารตามปกติ (ไม่หายไปเฉยๆ)
    let image = null;
    const mockupLabel = imgHeaderIdx > -1 ? headers[imgHeaderIdx].trim() : null;
    if(mockupLabel){
      const md = docs.find(d => d.label === mockupLabel);
      if(md && isUrl(md.val)){
        if(isImageUrl(md.val)){
          image = md.val;
          docs = docs.filter(d => d !== md);
        } else if(driveFileId(md.val)){
          // ลิงก์ Google Drive แบบทั่วไป (เช่น .../file/d/XXX/view) -> แปลงเป็นลิงก์รูปที่ฝังแสดงได้จริงให้อัตโนมัติ
          image = toDriveImageUrl(md.val);
          docs = docs.filter(d => d !== md);
        }
      }
    }
    if(!image){
      const imgDoc = docs.find(d => isImageUrl(d.val));
      if(imgDoc){ image = imgDoc.val; docs = docs.filter(d => d !== imgDoc); }
    }

    const edges = edgeCols.map(o => {
      const v = (row[o.i]||'').trim();
      return {label:o.h.trim(), val:v, on:/^(true|yes|1|✓|✔)$/i.test(v)};
    });
    out.push({
      category: lastCat || '',
      name,
      size: (row[sizeIdx]||'').trim(),
      image, docs, edges
    });
  }
  if(!anyCatFound){
    out.forEach(p => p.category = sheetName);
  } else {
    out.forEach(p => { if(!p.category) p.category = 'ไม่ระบุหมวดหมู่'; });
  }
  return out;
}

/* ---------- SYSTEM SHEET PARSER ---------- */
// ชีท "System" มีโครงสร้างต่างจากชีทสินค้าทั่วไป: แถวหัวข้อกลุ่มคั่นเป็นช่วงๆ (merge เต็มแถว)
// ตามด้วยหัวตารางกลุ่ม (ค่าการกันเสียง (STC) x3) และหัวตารางคอลัมน์จริง (ลำดับที่/ระบบ/ส่วนประกอบ...)
// ฟังก์ชันนี้คืนค่า null ถ้าชีทที่ดึงมาไม่ใช่โครงสร้างแบบ System (ให้ไปใช้ buildProducts ตามปกติ)
function buildSystemItems(rows){
  let headerRowIdx = -1;
  for(let r=0; r<Math.min(rows.length,8); r++){
    if(rows[r].some(c => (c||'').trim() === 'ลำดับที่')){ headerRowIdx = r; break; }
  }
  if(headerRowIdx === -1) return null;

  // หัวตารางบางชีทแยกเป็นหลายแถว: แถวบนสุดเป็นชื่อกลุ่ม (เช่น "ค่าการกันเสียง (STC)"),
  // ตามด้วยแถวย่อยจริง (เช่น "ไม่ใส่ฉนวน"/"Report"/"System") ซึ่งอาจมีแถวว่างคั่นอยู่ระหว่างกลางด้วย
  // จึงไล่มองลึกลงไปทีละแถว (ข้ามแถวว่างได้) รวมข้อความที่เจอเข้ากับหัวตารางหลัก
  // จนกว่าจะเจอแถวข้อมูลจริง (คอลัมน์แรกเป็นตัวเลขล้วน เช่น "1","2","10.1") จึงหยุด
  const headers = rows[headerRowIdx].map(h => (h||'').trim());
  let headerRowsUsed = 1;
  for(let d=1; d<=4; d++){
    const r = rows[headerRowIdx+d];
    if(!r) break;
    if(/^\d+(\.\d+)?$/.test((r[0]||'').trim())) break; // เจอแถวข้อมูลจริงแล้ว หยุดไม่ถือเป็นหัวตาราง
    for(let i=0;i<Math.max(headers.length, r.length);i++){
      const v = (r[i]||'').trim();
      if(v) headers[i] = v;
    }
    headerRowsUsed = d+1;
  }
  const find = (re) => headers.findIndex(h => re.test(h));
  let nameIdx     = headers.findIndex(h => h.trim() === 'ระบบ');
  const compIdx     = find(/ส่วนประกอบ/);
  const thickIdx    = find(/ความหนา/);
  const heightIdx   = headers.findIndex(h => h.trim() === 'แนะนำ');
  const fireRecIdx  = find(/ที่แนะนำ/);
  const fireTestIdx = find(/ผลทดสอบ|อิงผล/);
  let ceilingIdx = headers.findIndex(h => /ฝ้าเพดาน/.test(h));
  if(ceilingIdx === -1 && headers.length) ceilingIdx = headers.length - 1; // ปกติคอลัมน์นี้อยู่ขวาสุดของตารางเสมอ
  console.log('[System parser] fireTestIdx=', fireTestIdx, 'ceilingIdx=', ceilingIdx, 'ceilingHeader=', JSON.stringify(headers[ceilingIdx]), 'headers.length=', headers.length);
  if(nameIdx === -1) nameIdx = 1; // เผื่อหัวคอลัมน์สะกดไม่ตรงเป๊ะ ให้ถือว่าคอลัมน์ถัดจาก "ลำดับที่" คือชื่อระบบ
  console.log('[System parser] headerRowIdx =', headerRowIdx, 'headers =', headers);

  // หาแต่ละกลุ่ม "ค่าการกันเสียง (STC)" จากคอลัมน์ Report/System (ภาษาอังกฤษล้วน กันปัญหาสะกดไทยไม่ตรง)
  // เผื่อมีคอลัมน์ว่างแฝง (hidden spacer column) คั่นอยู่ จึงไม่ยึดตำแหน่งติดกันเป๊ะ แต่ไล่หาแบบยืดหยุ่น:
  //   1) หา "Report" ทุกตำแหน่ง
  //   2) มองไปข้างหน้าไม่เกิน 3 ช่องเพื่อหา "System" ที่คู่กัน
  //   3) ไล่ย้อนกลับจาก Report หาคอลัมน์ค่า (ชื่อกลุ่ม) ตัวที่ใกล้สุดที่ไม่ว่าง
  const stcGroupsDef = [];
  for(let i=0;i<headers.length;i++){
    if(!/^report$/i.test((headers[i]||'').trim())) continue;
    let systemCol = -1;
    for(let k=i+1;k<Math.min(i+4,headers.length);k++){
      if(/^system$/i.test((headers[k]||'').trim())){ systemCol = k; break; }
    }
    if(systemCol === -1) continue;
    let valueCol = -1;
    for(let k=i-1;k>=Math.max(0,i-4);k--){
      if((headers[k]||'').trim()){ valueCol = k; break; }
    }
    if(valueCol === -1) continue;
    stcGroupsDef.push({idx:valueCol, reportCol:i, systemCol, label:(headers[valueCol]||'').trim() || 'ค่าการกันเสียง (STC)'});
  }
  console.log('[System parser] stcGroupsDef =', stcGroupsDef);

  // หัวข้อหมวดใหญ่ (เช่น "ระบบผนัง Dry Wall TOA") มักอยู่เหนือแถวหัวตาราง จึงต้องดักจับไว้ก่อนเริ่มลูปข้อมูล
  let currentCategory = '';
  for(let r = 0; r < headerRowIdx; r++){
    const t = (rows[r] && rows[r][0] || '').trim();
    if(t) currentCategory = t;
  }

  const items = [];
  for(let r = headerRowIdx + headerRowsUsed; r < rows.length; r++){
    const row = rows[r];
    if(!row || row.every(c => !c || !c.trim())) continue;
    if((row[0]||'').trim() === 'ลำดับที่') continue; // หัวตารางซ้ำ (บางชีทจัดวางหัวซ้ำทุกช่วง)

    const nameVal = (row[nameIdx]||'').trim();
    if(!nameVal){
      const t = (row[0]||'').trim();
      if(t) currentCategory = t; // แถวหัวข้อกลุ่มใหม่ (merge เต็มแถว เช่น "ระบบผนัง Dry Wall TOA")
      continue;
    }
    if(nameVal === 'ระบบ') continue; // กันหัวตารางซ้ำกรณี nameIdx ตรงกับคำว่า "ระบบ" เป๊ะ

    if(/VIP LINE STEEL 0\.4\s*$/.test(nameVal)){
      console.log('[System parser] DEBUG row =', JSON.stringify(row));
      console.log('[System parser] DEBUG row.length=', row.length, 'headers.length=', headers.length, 'ceilingIdx=', ceilingIdx, 'row[ceilingIdx]=', JSON.stringify(row[ceilingIdx]));
    }
    const stcGroups = stcGroupsDef.map(g => ({
      label: g.label.trim(),
      value: (row[g.idx]||'').trim(),
      report: (row[g.reportCol]||'').trim(),
      system: (row[g.systemCol]||'').trim()
    }));

    items.push({
      category: currentCategory || 'ระบบ',
      name: nameVal,
      components: compIdx  > -1 ? (row[compIdx]||'').trim()  : '',
      thickness:  thickIdx > -1 ? (row[thickIdx]||'').trim() : '',
      heightRec:  heightIdx> -1 ? (row[heightIdx]||'').trim(): '',
      fireRec:    fireRecIdx > -1 ? (row[fireRecIdx]||'').trim()  : '',
      fireTest:   fireTestIdx> -1 ? (row[fireTestIdx]||'').trim() : '',
      ceilingLabel: ceilingIdx > -1 ? (headers[ceilingIdx]||'').trim() : 'ระบบฝ้าเพดาน',
      ceiling:    ceilingIdx > -1 ? (row[ceilingIdx]||'').trim() : '',
      stcGroups
    });
  }
  console.log('[System parser] items ceiling sample =', items.map(x => x.name + '  =>  [' + x.ceiling + ']'));
  return items;
}

/* ---------- RENDER (catalog view) ---------- */
function renderCats(){
  const cats = ['ทั้งหมด', ...Array.from(new Set(currentItems().map(p=>p.category)))];
  const box = document.getElementById('cats');
  box.innerHTML = '';
  cats.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'cat-btn' + (c===activeCat ? ' active' : '');
    b.innerHTML = `<span class="ic">${c==='ทั้งหมด' ? '🗂️' : iconFor(c)}</span><span class="lbl">${c}</span>`;
    b.onclick = ()=>{ activeCat=c; render(); };
    box.appendChild(b);
  });
}

function render(){
  renderCats();
  const q = document.getElementById('search').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  const filtered = currentItems().filter(p=>{
    const matchCat = activeCat==='ทั้งหมด' || p.category===activeCat;
    const haystack = dataMode === 'system' ? (p.name+' '+p.components) : (p.name+' '+p.size);
    const matchQ = !q || haystack.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  grid.innerHTML = '';
  if(!filtered.length){
    grid.innerHTML = '<div class="empty">ไม่พบรายการที่ตรงกับเงื่อนไข</div>';
    return;
  }
  filtered.forEach(p => grid.appendChild(dataMode === 'system' ? buildSystemCard(p) : buildProductCard(p)));
}

function buildProductCard(p){
  const card = document.createElement('div');
  card.className = 'card';
  const edgeTxt = p.edges.filter(e=>e.on).map(e=>e.label).join(' • ');
  const thumbHtml = p.image
    ? `<img src="${p.image}" alt="${p.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='<span class=ph>${iconFor(p.category)}</span>'">`
    : `<span class="ph">${iconFor(p.category)}</span>`;
  card.innerHTML = `
    <div class="thumb">${thumbHtml}</div>
    <div class="body">
      <div class="cat-tag">${p.category}</div>
      <h3>${p.name}</h3>
      <div class="size">📐 ${p.size || '-'}</div>
      ${edgeTxt ? `<div class="edge-row">✔️ ${edgeTxt}</div>` : ''}
      <div class="badges">${p.docs.map(d => isUrl(d.val)
          ? `<a class="badge link" href="${d.val}" target="_blank" rel="noopener">📎 ${d.label}</a>`
          : `<span class="badge" title="${d.val}">${d.label}</span>`
        ).join('') || '<span class="badge" style="opacity:.5">ไม่มีเอกสารแนบ</span>'}</div>
    </div>
  `;
  card.querySelectorAll('a.badge.link').forEach(a => a.addEventListener('click', e => e.stopPropagation()));
  card.addEventListener('click', () => openModal(p));
  return card;
}

function buildSystemCard(it){
  const card = document.createElement('div');
  card.className = 'card';
  const descParts = [];
  if(it.components) descParts.push(it.components.replace(/\n+/g, ' / '));
  if(it.thickness)  descParts.push('หนา ' + it.thickness + ' มม.');
  if(it.heightRec)  descParts.push('สูงแนะนำ ' + it.heightRec + ' ม.');
  card.innerHTML = `
    <div class="thumb"><span class="ph">${iconFor(it.category)}</span></div>
    <div class="body">
      <div class="cat-tag">${it.category}</div>
      <h3>${it.name}</h3>
      <div class="sys-desc">${descParts.join(' · ')}</div>
    </div>
  `;
  card.addEventListener('click', () => openSystemModal(it));
  return card;
}

function openSystemModal(it){
  const descParts = [];
  if(it.components) descParts.push(it.components.replace(/\n+/g, ' / '));
  if(it.thickness)  descParts.push('หนา ' + it.thickness + ' มม.');
  if(it.heightRec)  descParts.push('สูงแนะนำ ' + it.heightRec + ' ม.');

  let idx = 0;
  const stcHtml = it.stcGroups.map(g => `
    <div class="stc-block">
      <div class="stc-head">
        <div class="stc-label">${g.label}</div>
        ${g.value ? `<div class="stc-value">${g.value} dB</div>` : '<div class="stc-value" style="color:var(--muted);font-weight:500;">ไม่มีข้อมูล</div>'}
      </div>
      <div class="doc-list" style="margin-top:0;border-top:none;padding-top:0;">
        ${docRowHtml({label:'Report', val:g.report}, idx++)}
        ${docRowHtml({label:'System', val:g.system}, idx++)}
      </div>
    </div>
  `).join('');

  const hasFire = it.fireRec || it.fireTest;
  const ceilingHtml = it.ceiling
    ? `<div class="doc-list" style="margin-top:0;">${docRowHtml({label:it.ceilingLabel || 'ผลทดสอบ', val:it.ceiling}, idx++)}</div>`
    : '<div class="sys-desc">ไม่มีข้อมูล</div>';

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-hero"><span class="ph">${iconFor(it.category)}</span></div>
    <div class="modal-body">
      <span class="cat-tag">${it.category}</span>
      <h2>${it.name}</h2>
      ${descParts.length ? `<div class="sys-desc">${descParts.join(' · ')}</div>` : ''}

      <div class="sys-section-title">🔊 ค่าการกันเสียง (STC)</div>
      ${stcHtml || '<div class="sys-desc">ไม่มีข้อมูล</div>'}

      ${hasFire ? `
      <div class="sys-section-title">🔥 การทนไฟ (hr:min)</div>
      <div class="fire-grid">
        <div class="fire-card"><div class="fl">เวลาที่แนะนำ</div><div class="fv">${it.fireRec || '-'}</div></div>
        <div class="fire-card"><div class="fl">การทนไฟ (อิงผลทดสอบ)</div><div class="fv">${it.fireTest || '-'}</div></div>
      </div>` : ''}

      <div class="sys-section-title">🏠 ระบบฝ้าเพดาน</div>
      ${ceilingHtml}
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
}

/* ---------- PRODUCT DETAIL MODAL ---------- */
function docRowHtml(doc, idx){
  const d = classifyDoc(doc.val);
  if(d.type === 'none'){
    return `<div class="doc-row none"><div class="doc-head"><span class="doc-label">📄 ${doc.label}</span><span style="font-size:.72rem;color:var(--muted)">ยังไม่มีลิงก์</span></div></div>`;
  }
  const previewable = ['image','video','pdf','youtube','vimeo','drive'].includes(d.type);
  const rowId = `docprev-${idx}`;
  let actions = `<a class="dl" href="${d.url}" target="_blank" rel="noopener">⬇️ ดาวน์โหลด</a>`;
  if(previewable){
    actions = `<button onclick="togglePreview('${rowId}')">👁️ ดูตัวอย่าง</button>` + actions;
  }
  let previewHtml = '';
  if(d.type === 'image') previewHtml = `<img src="${d.url}" alt="${doc.label}">`;
  else if(d.type === 'video') previewHtml = `<video controls src="${d.url}"></video>`;
  else if(['pdf','youtube','vimeo','drive'].includes(d.type)) previewHtml = `<iframe src="${d.embed}" allow="autoplay; fullscreen"></iframe>`;
  return `
    <div class="doc-row">
      <div class="doc-head">
        <span class="doc-label">📄 ${doc.label}</span>
        <div class="doc-actions">${actions}</div>
      </div>
      ${previewable ? `<div class="doc-preview" id="${rowId}">${previewHtml}</div>` : ''}
    </div>`;
}
function togglePreview(id){
  const el = document.getElementById(id);
  if(el) el.classList.toggle('open');
}

function openModal(p){
  const edgeTxt = p.edges.filter(e=>e.on).map(e=>e.label).join(' • ');
  const heroHtml = p.image
    ? `<img src="${p.image}" alt="${p.name}" referrerpolicy="no-referrer">`
    : `<span class="ph">${iconFor(p.category)}</span>`;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-hero">${heroHtml}</div>
    <div class="modal-body">
      <span class="cat-tag">${p.category}</span>
      <h2>${p.name}</h2>
      <div class="size">📐 ${p.size || '-'}</div>
      ${edgeTxt ? `<div class="edge-row">✔️ ${edgeTxt}</div>` : ''}
      <div class="doc-list">${p.docs.length ? p.docs.map(docRowHtml).join('') : '<div class="doc-row none"><span class="doc-label">ไม่มีเอกสารแนบสำหรับสินค้านี้</span></div>'}</div>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeModal(); });

async function loadData(){
  const status = document.getElementById('status');
  const err = document.getElementById('err');
  const sheetName = document.getElementById('sheetTab').value;
  status.innerHTML = '<span class="spin"></span> กำลังโหลดข้อมูลล่าสุด...';
  err.style.display = 'none';
  try{
    const {text, source} = await fetchCsvText(sheetName);
    const rows = parseCSV(text);

    // ชีท System มีโครงสร้างพิเศษ (กลุ่ม STC / การทนไฟ) ต่างจากชีทสินค้าทั่วไป
    const systemItems = buildSystemItems(rows);
    if(systemItems){
      dataMode = 'system';
      allSystemItems = systemItems;
    } else {
      dataMode = 'product';
      allProducts = buildProducts(rows, sheetName);
    }

    const now = new Date();
    const t = 'อัปเดตล่าสุด ' + now.toLocaleTimeString('th-TH');
    document.getElementById('topSync').textContent = t;
    status.textContent = `พบ ${currentItems().length} รายการ ในกลุ่ม "${sheetName}" (แหล่งข้อมูล: ${source})`;
    activeCat = 'ทั้งหมด';
    render();
  }catch(e){
    status.textContent = 'โหลดข้อมูลไม่สำเร็จ';
    err.style.display = 'block';
    err.innerHTML = `⚠️ ดึงข้อมูลจาก Google Sheet ไม่สำเร็จ: <b>${e.message}</b><br><br>
      โปรดตรวจสอบว่า:<br>
      1) แชร์ Sheet เป็น "ทุกคนที่มีลิงก์ - ดูได้" (Anyone with the link - Viewer)<br>
      2) ชื่อแท็บ "${sheetName}" มีอยู่จริงในไฟล์<br>
      3) หากเปิดไฟล์นี้แบบ local (file://) บางเบราว์เซอร์อาจบล็อก fetch — ลองเปิดผ่าน host จริง`;
  }
}

document.getElementById('refreshBtn').onclick = loadData;
document.getElementById('sheetTab').onchange = (e)=> showCatalog(e.target.value);
document.getElementById('search').oninput = render;
document.getElementById('autoRefresh').onchange = (e)=>{
  if(e.target.checked) startPolling(); else clearInterval(pollTimer);
};

function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(loadData, 60000);
}

/* ---------- DARK / LIGHT MODE ---------- */
const THEME_KEY = 'catalog-theme';
function currentTheme(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const dark = t === 'dark';
  document.getElementById('themeIcon').textContent  = dark ? '☀️' : '🌙';
  document.getElementById('themeLabel').textContent = dark ? 'โหมดสว่าง' : 'โหมดมืด';
  document.getElementById('themeToggle').setAttribute('aria-pressed', String(dark));
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', dark ? '#061a45' : '#0a3fa8');
}
document.getElementById('themeToggle').onclick = ()=>{
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
};
applyTheme(currentTheme());
// ถ้ายังไม่เคยเลือกเอง ให้ตามโหมดของอุปกรณ์แบบเรียลไทม์
if(window.matchMedia){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e=>{
    let saved = null; try{ saved = localStorage.getItem(THEME_KEY); }catch(_){}
    if(!saved) applyTheme(e.matches ? 'dark' : 'light');
  });
}
